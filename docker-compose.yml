volumes:
  pg_data:
  static:

services:
  db:
    image: postgres:13.10
    restart: unless-stopped
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
  backend:
    build: ./backend/
    env_file: .env
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - static:/backend_static
  frontend:
    build: ./frontend/
    command: cp -r /app/build/. /staticfiles/
    volumes:
      - static:/staticfiles
  gateway:
    build: ./gateway/
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - static:/staticfiles
    depends_on:
      - backend
      - frontend
